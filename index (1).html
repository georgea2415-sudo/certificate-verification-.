<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate Verification</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

.card {
    max-width: 720px;
    margin: 60px auto;
    background: #ffffff;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
}

.logo {
    font-weight: 700;
    color: #1456b8;
    font-size: 22px;
    margin-bottom: 28px;
}

h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.status {
    display: inline-block;
    background: #e8f7ed;
    color: #16743a;
    padding: 9px 16px;
    border-radius: 20px;
    font-weight: 700;
    margin: 12px 0 28px;
}

.row {
    display: flex;
    padding: 15px 0;
    border-bottom: 1px solid #e8ebf0;
}

.label {
    width: 42%;
    font-weight: 700;
    color: #687386;
}

.value {
    width: 58%;
}
</style>

</head>

<body>

<div class="card">

    <div class="logo">CERTIFICATE VERIFICATION</div>

    <h1>Certificate Details</h1>

    <div class="status">
        ✓ Certificate Status: Verified
    </div>

    <div class="row">
        <div class="label">Name</div>
        <div class="value">George Peter A</div>
    </div>

    <div class="row">
        <div class="label">Student ID</div>
        <div class="value">CA/DF1/296960</div>
    </div>

    <div class="row">
        <div class="label">Program</div>
        <div class="value">Internet of Things (IoT) Internship</div>
    </div>

    <div class="row">
        <div class="label">Duration</div>
        <div class="value">10 July 2026 – 10 August 2026</div>
    </div>

    <div class="row">
        <div class="label">Issue Date</div>
        <div class="value">11 August 2026</div>
    </div>

    <div class="row">
        <div class="label">Certificate ID</div>
        <div class="value">CA-IOT-296960</div>
    </div>

    <div class="row">
        <div class="label">Completion Status</div>
        <div class="value">Internship Completed</div>
    </div>

</div>

</body>
</html>
